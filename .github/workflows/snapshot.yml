name: Snapshot
on:
  workflow_dispatch:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main, compat/mtr-4.0-mc-1.20]
permissions:
  contents: read
  actions: read
concurrency:
  group: snapshot-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'teamCreating/MTR-Map-Overlay' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Update this branch's verified Snapshot files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/publish.py snapshot
