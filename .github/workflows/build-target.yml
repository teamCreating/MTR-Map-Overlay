name: Build target
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      source-sha:
        required: true
        type: string
      retention-days:
        default: 14
        type: number
permissions:
  contents: read
jobs:
  build:
    name: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - name: Checkout fixed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source-sha }}
          path: source
          persist-credentials: false
      - name: Install Java 17 toolchain for compatibility builds
        if: startsWith(inputs.target, '1.20.')
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Gradle using Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-disabled: ${{ endsWith(inputs.target, '-fabric') }}
          cache-read-only: ${{ github.event_name != 'push' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/compat/mtr-4.0-mc-1.20') }}
      - name: Compile, test and verify production JAR
        env:
          TARGET: ${{ inputs.target }}
        run: python automation/tools/ci/pipeline.py build --root source --target "$TARGET" --out target-output
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: target-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target-output/
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
      - name: Preserve diagnostics even when the build fails
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: diagnostics-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build.log
            source/**/test-results/test/*.xml
            source/**/reports/tests/test/**
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: ignore
