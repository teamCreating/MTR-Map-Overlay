name: build
on:
  push:
    branches: [main, compat/mtr-4.0-mc-1.20]
  pull_request:
    branches: [main, compat/mtr-4.0-mc-1.20]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      branch: ${{ steps.branch.outputs.branch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: branch
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: python3 tools/ci/pipeline.py branch-plan --branch "$BRANCH"
  tooling-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
  targets:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build-target.yml
    with:
      target: ${{ matrix.target }}
      source-sha: ${{ github.sha }}
  bundle:
    needs: [plan, targets, tooling-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: target-*-${{ github.run_id }}-*
          path: incoming
      - name: Verify and collect branch artifacts
        env:
          BRANCH: ${{ needs.plan.outputs.branch }}
        run: |
          python3 tools/ci/pipeline.py branch-source --branch "$BRANCH" --root .
          python3 tools/ci/pipeline.py bundle --incoming incoming --out ci-bundle --plan source-plan.json --kind ci --branch "$BRANCH"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ci-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-bundle/
          if-no-files-found: error
          retention-days: 14
  gate:
    name: CI Gate
    if: always()
    needs: [plan, tooling-tests, targets, bundle]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PY
