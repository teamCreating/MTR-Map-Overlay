plugins {
    id 'net.neoforged.moddev' version '2.0.146'
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            gameDirectory = file('run')
            // ./gradlew runClient -Pquickplay=TestWorld launches straight into a world
            if (project.hasProperty('quickplay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickplay').toString())
            }
        }
        server {
            server()
            gameDirectory = file('run-server')
        }
    }

    mods {
        mtrsurveyor {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "JourneyMap"
                url = "https://jm.gserv.me/repository/maven-public"
            }
        }
        filter {
            includeGroup "info.journeymap"
        }
    }
}

dependencies {
    // MTR 4.1.0-beta (NeoForge 1.21.1) - compileOnly: MTR ships its own shaded core
    compileOnly "maven.modrinth:minecraft-transit-railway:${project.mtr_modrinth_version}"

    // Xaero's Minimap (waypoint sync)
    compileOnly "maven.modrinth:xaeros-minimap:${project.xaero_minimap_modrinth_version}"

    // Xaero's World Map (path layer render hook)
    compileOnly "maven.modrinth:xaeros-world-map:${project.xaero_world_map_modrinth_version}"

    // JourneyMap v2 API (landmark integration)
    compileOnly("info.journeymap:journeymap-api-neoforge:${project.journeymap_api_version}") {
        exclude(group: "curse.maven") // transitive pulls an old Forge JourneyMap
    }

    // RoutePathfinder unit tests run against the pure mtr-core data layer
    testImplementation "maven.modrinth:minecraft-transit-railway:${project.mtr_modrinth_version}"
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "mtr_version", project.mtr_version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "mtr_version": project.mtr_version
    }
}

jar {
    manifest {
        attributes([
            "Specification-Title": "mtrsurveyor",
            "Specification-Vendor": "BenLi06",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor" :"BenLi06",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs": "mtrsurveyor.mixins.json"
        ])
    }
}
