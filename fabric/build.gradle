plugins { id 'fabric-loom' version '1.17.21' }
def sharedProperties = new Properties()
file('../gradle.properties').withInputStream { sharedProperties.load(it) }
def mcVersion = project.findProperty('minecraft_version') ?: sharedProperties.getProperty('minecraft_version')
ext.minecraft_version = mcVersion
ext.journeyMapLoader = 'fabric'
apply from: '../gradle/minecraft-target.gradle'
version = sharedProperties.getProperty('mod_version')
group = sharedProperties.getProperty('maven_group')
base.archivesName = sharedProperties.getProperty('archives_base_name') + '-fabric-mc' + mcVersion
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
repositories {
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroupByRegex 'org.junit.*'
            includeGroup 'org.opentest4j'
            includeGroup 'org.apiguardian'
        }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation "net.fabricmc.fabric-api:fabric-api:${legacyJourneyMap ? '0.97.3+1.20.4' : '0.92.6+1.20.1'}"
    add(project.hasProperty('mtrmapRuntimeTest') ? 'modImplementation' : 'modCompileOnly', "maven.modrinth:minecraft-transit-railway:FABRIC-4.0.5+${mcVersion}")
    add(project.hasProperty('mtrmapRuntimeTest') && !project.hasProperty('mtrmapServerOnly') ? 'modImplementation' : 'modCompileOnly', "maven.modrinth:xaeros-minimap:fabric-${mcVersion}-26.4.2")
    add(project.hasProperty('mtrmapRuntimeTest') && !project.hasProperty('mtrmapServerOnly') ? 'modImplementation' : 'modCompileOnly', "maven.modrinth:xaeros-world-map:fabric-${mcVersion}-1.45.0")

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testImplementation "maven.modrinth:minecraft-transit-railway:FABRIC-4.0.5+${mcVersion}"
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets.test.java.srcDir('../src/test/java')
test {
    useJUnitPlatform()
    systemProperty 'mtrmap.generateTestWorld', project.findProperty('mtrmapGenerateTestWorld') ?: 'false'
    systemProperty 'mtrmap.testWorldMtrPath', project.findProperty('mtrmapTestWorldMtrPath') ?: 'run/saves/TestWorld/mtr'
}
sourceSets.main.resources.srcDir('../src/main/resources')
sourceSets.main.resources.exclude('META-INF/mods.toml', 'mtrmap.mixins.json')
compileJava.source(fileTree('../src/main/java') {
    exclude 'io/github/teamcreating/mtrmap/train/TrainServerEvents.java'
    exclude 'io/github/teamcreating/mtrmap/MTRMap.java'
    exclude 'io/github/teamcreating/mtrmap/MTRMapClient.java'
    exclude 'io/github/teamcreating/mtrmap/config/MTRMapConfig.java'
    exclude 'io/github/teamcreating/mtrmap/network/MTRNetwork.java'
    exclude 'io/github/teamcreating/mtrmap/network/MTRNetworkClient.java'
    exclude 'io/github/teamcreating/mtrmap/CommandRegistration.java'
    exclude 'io/github/teamcreating/mtrmap/mixin/client/xaero/XaeroWorldMapMixin.java'
})
processResources {
    inputs.properties(version: project.version, minecraft_version: mcVersion, pack_format: targetPackFormat)
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) { expand version: project.version, minecraft_version: mcVersion, pack_format: targetPackFormat }
}
jar {
    from('../LICENSE')
    manifest.attributes('MixinConfigs': 'mtrmap.fabric.mixins.json')
}

apply from: '../gradle/journeymap-api.gradle'

if (project.hasProperty('mtrmapRuntimeTest')) {
    dependencies {
        if (!project.hasProperty('mtrmapServerOnly')) {
            modImplementation "maven.modrinth:journeymap:${journeyMapModVersion}"
            // Loom does not discover this nested dependency from a development classpath.
            def libVersion = "${mcVersion}-1.7.1"
            def libDir = file(".gradle/bundled-api/bundled/xaero/lib/${libVersion}")
            def libJar = new File(libDir, "lib-${libVersion}.jar")
            if (!libJar.exists()) {
                libDir.mkdirs()
                // Early Gradle resolution freezes Loom's remapped repository. Read the
                // pinned bundle directly, verifying it before extracting the nested library.
                def bundleVersion = "fabric-${mcVersion}-1.45.0"
                def sha1 = legacyJourneyMap ? '8ee17a8d80b515cb5f67d6363f575812f90d88b0' : '7cb6fa8e6acfe940b5da651fdab22015c1a57c8d'
                def bundleName = "xaeros-world-map-${bundleVersion}.jar"
                def bundle = new File(gradle.gradleUserHomeDir, "caches/modules-2/files-2.1/maven.modrinth/xaeros-world-map/${bundleVersion}/${sha1}/${bundleName}")
                if (!bundle.exists()) {
                    bundle = new File(libDir, 'xaero-bundle.jar')
                    def connection = new URI("https://api.modrinth.com/maven/maven/modrinth/xaeros-world-map/${bundleVersion}/${bundleName}").toURL().openConnection()
                    connection.connectTimeout = 30000
                    connection.readTimeout = 60000
                    connection.getInputStream().withCloseable { input -> bundle.withOutputStream { it << input } }
                }
                def digest = java.security.MessageDigest.getInstance('SHA-1')
                bundle.withInputStream { input ->
                    byte[] buffer = new byte[8192]
                    int length
                    while ((length = input.read(buffer)) != -1) digest.update(buffer, 0, length)
                }
                if (digest.digest().encodeHex().toString() != sha1) throw new GradleException('Xaero bundle checksum mismatch')
                new java.util.zip.ZipFile(bundle).withCloseable { zip ->
                    def entry = zip.entries().find { it.name.startsWith('META-INF/jars/xaerolib-') && it.name.endsWith('.jar') }
                    if (entry == null) throw new GradleException('Xaero bundle contains no library JAR')
                    zip.getInputStream(entry).withCloseable { input -> libJar.withOutputStream { it << input } }
                }
            }
            new File(libDir, "lib-${libVersion}.pom").text = "<project><modelVersion>4.0.0</modelVersion><groupId>bundled.xaero</groupId><artifactId>lib</artifactId><version>${libVersion}</version></project>"
            // A Maven module joins Loom's dependency remapping classpath; a loose file
            // is processed later and leaves inherited Screen fields in intermediary names.
            modImplementation "bundled.xaero:lib:${libVersion}"
        }
    }
    loom.runs {
        client {
            runDir project.findProperty('mtrmapRunDir') ?: 'run'
            if (project.hasProperty('quickplayServer')) programArgs '--quickPlayMultiplayer', project.property('quickplayServer')
            else if (project.hasProperty('quickplay')) programArgs '--quickPlaySingleplayer', project.property('quickplay')
        }
        server {
            runDir project.findProperty('mtrmapRunDir') ?: 'run-server'
            programArgs 'nogui'
        }
    }
}

if (legacyJourneyMap) {
    def common = fileTree('../compat/mc1204/common/java')
    def fabric = fileTree('../compat/mc1204/fabric/java')
    def overrides = (common.files.collect { common.dir.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
            + fabric.files.collect { fabric.dir.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
            + journeyMap5Overrides)
    compileJava.setSource(files(fileTree('src/main/java') { exclude overrides },
            fileTree('../src/main/java') {
                exclude overrides
                exclude 'io/github/teamcreating/mtrmap/train/TrainServerEvents.java', 'io/github/teamcreating/mtrmap/MTRMap.java', 'io/github/teamcreating/mtrmap/MTRMapClient.java',
                        'io/github/teamcreating/mtrmap/config/MTRMapConfig.java', 'io/github/teamcreating/mtrmap/CommandRegistration.java',
                        'io/github/teamcreating/mtrmap/network/MTRNetwork.java', 'io/github/teamcreating/mtrmap/network/MTRNetworkClient.java',
                        'io/github/teamcreating/mtrmap/mixin/client/xaero/XaeroWorldMapMixin.java'
            }, common, fabric, journeyMap5GeneratedSources))
    compileJava.dependsOn generateJourneyMap5Adapters
    processResources.doLast {
        def config = new File(destinationDir, 'mtrmap.fabric.mixins.json')
        def json = new groovy.json.JsonSlurper().parse(config)
        json.client.add('client.journeymap.JourneyMapFullscreenMixin')
        config.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
    }
}
