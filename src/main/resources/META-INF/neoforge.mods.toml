modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/teamCreating/MTR-Xareo-Mapper/issues"

[[mods]]
modId = "mtrmap"
version = "${version}"
displayName = "MTR Map Overlay"
description = '''Displays MTR route ribbons, track geometry and map-only station/platform icons on Xaero's World Map and JourneyMap. Supports optional full-network sync when installed on the server.'''
logoFile = "assets/mtrmap/icon.png"
authors = "BenLi06"

[[dependencies.mtrmap]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.mtrmap]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.mtrmap]]
modId = "mtr"
type = "required"
versionRange = "[${mtr_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.mtrmap]]
modId = "xaerominimap"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.mtrmap]]
modId = "xaeroworldmap"
type = "optional"
versionRange = "[1.45.0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.mtrmap]]
modId = "journeymap"
type = "optional"
versionRange = "[1.21.1-6.0.8,)"
ordering = "AFTER"
side = "CLIENT"

[[mixins]]
config = "mtrmap.mixins.json"
