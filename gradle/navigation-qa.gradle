// Local CLI integration checks only. The development mod is never included in release JARs.
sourceSets {
    navigationQa {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge {
    mods { mtrmapqa { sourceSet sourceSets.navigationQa } }
    runs.client {
        systemProperty 'mtrmap.qa.output', rootProject.file('build/navigation-qa').absolutePath
    }
}

tasks.register('navigationQaJar', Jar) {
    dependsOn tasks.named('navigationQaClasses'), tasks.named('processResources')
    archiveBaseName = 'mtrmap-acceptance-qa-neoforge'
    archiveVersion = project.version
    destinationDirectory = layout.buildDirectory.dir('qa')
    from sourceSets.navigationQa.output
    from(sourceSets.main.output.resourcesDir) { include 'pack.mcmeta' }
}
